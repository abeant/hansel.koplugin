name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Tests
        run: ./tests/run.sh
        env:
          LUA: luajit
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version = \".*\"/version = \"${VERSION}\"/" _meta.lua
      - name: Package
        run: ./scripts/package.sh
      - name: Checksums
        run: sha256sum hansel.koplugin.zip > SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hansel.koplugin
          path: |
            hansel.koplugin.zip
            SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" hansel.koplugin.zip SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" hansel.koplugin.zip SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "Hansel ${GITHUB_REF_NAME#v}"
          fi
